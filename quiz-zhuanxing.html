<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中女转型坐标测试 · 你是哪种转型人？· 她说了算</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a0e08;--warm:#7a3c1a;--amber:#b8862c;--amber-l:#f5edd8;--gold:#c49a3c;
  --plum:#3d1536;--rose:#c4587a;--blush:#f0dce8;
  --forest:#1a3d2b;--sage:#52a87a;--mint:#d4ede2;
  --cream:#fdfaf5;--sand:#f5ede4;--rule:#e2d4c8;
  --text:#2a1a0e;--mid:#6b4830;--light:#9a7860;--white:#fff;
  --E:#b8862c;--E-l:#f5edd8;  /* 蓄势型 amber */
  --S:#1d4a35;--S-l:#d6ede0;  /* 深潜型 teal */
  --B:#c4587a;--B-l:#f0dce8;  /* 破壳型 rose */
  --R:#3d1536;--R-l:#ede0f0;  /* 重塑型 plum */
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--cream);color:var(--text);font-family:'DM Sans','PingFang SC',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;}
.prog{height:3px;background:var(--rule);position:fixed;top:0;left:0;right:0;z-index:100;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--rose));width:0%;transition:width .5s ease;}

/* ── COVER ── */
.cover{min-height:100vh;background:linear-gradient(160deg,var(--ink) 0%,#3d1a06 60%,var(--warm) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;position:relative;overflow:hidden;}
.cover::before{content:'转';position:absolute;right:-30px;bottom:-50px;font-family:'Noto Serif SC',serif;font-size:360px;font-weight:700;color:rgba(255,255,255,.022);line-height:1;pointer-events:none;}
.cv-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);}
.cv-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(184,134,44,.2);border:1px solid rgba(184,134,44,.3);padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,218,140,.88);margin-bottom:20px;}
.cover h1{font-family:'Noto Serif SC',serif;font-size:clamp(28px,6vw,50px);font-weight:700;color:#fff;line-height:1.12;margin-bottom:12px;}
.cover h1 em{font-style:italic;color:rgba(255,218,140,.9);}
.cv-sub{font-size:14px;color:rgba(255,255,255,.45);margin-bottom:10px;}
.cv-desc{max-width:420px;font-size:15px;color:rgba(255,255,255,.55);line-height:1.85;margin-bottom:28px;}
.cv-types{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:380px;margin:0 auto 32px;}
.cv-type{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 14px;text-align:left;}
.ctt-icon{font-size:18px;margin-bottom:4px;}
.ctt-name{font-size:13px;font-weight:600;color:rgba(255,255,255,.85);}
.ctt-sub{font-size:11px;color:rgba(255,255,255,.38);margin-top:2px;}
.btn-start{display:inline-flex;align-items:center;gap:10px;padding:16px 40px;border-radius:10px;background:#fff;color:var(--warm);font-size:16px;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all .25s;}
.btn-start:hover{background:var(--amber-l);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.25);}
.cv-hint{margin-top:14px;font-size:12px;color:rgba(255,255,255,.22);}

/* ── QUIZ ── */
.quiz{display:none;min-height:100vh;padding:20px 0 60px;background:var(--cream);}
.quiz.active{display:block;}
.q-topbar{max-width:560px;margin:0 auto;padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between;}
.q-count{font-size:12px;color:var(--light);}
.q-count strong{font-family:'Noto Serif SC',serif;font-size:16px;color:var(--warm);}
.q-wrap{max-width:560px;margin:0 auto;padding:0 24px;}
.q-card{display:none;}
.q-card.active{display:block;animation:slideUp .4s ease both;}
@keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

/* scene */
.q-scene{background:linear-gradient(135deg,#f5ede4,#f0dce8);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--mid);line-height:1.72;margin-bottom:16px;font-style:italic;position:relative;border-left:3px solid var(--amber);}
.q-scene-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:5px;font-style:normal;}

.q-text{font-family:'Noto Serif SC',serif;font-size:clamp(17px,4vw,21px);font-weight:600;color:var(--warm);line-height:1.4;margin-bottom:20px;}

/* options */
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{padding:14px 16px;border:1.5px solid var(--rule);border-radius:12px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;text-align:left;background:var(--white);transition:all .2s;width:100%;font-family:inherit;}
.opt:hover{border-color:var(--amber);background:var(--amber-l);}
.opt.chosen{border-color:var(--warm);background:var(--warm);}
.opt-bullet{width:28px;height:28px;border-radius:8px;background:var(--sand);border:1.5px solid var(--rule);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--mid);transition:all .2s;}
.opt.chosen .opt-bullet{background:var(--amber);border-color:var(--amber);color:#fff;}
.opt-content{flex:1;}
.opt-main{font-size:14px;color:var(--text);line-height:1.55;transition:color .18s;font-weight:400;}
.opt-hint{font-size:11.5px;color:var(--light);margin-top:3px;transition:color .18s;}
.opt.chosen .opt-main,.opt.chosen .opt-hint{color:rgba(255,255,255,.88);}
.opt.chosen .opt-hint{color:rgba(255,255,255,.5);}

/* ── RESULT ── */
.result{display:none;min-height:100vh;padding:0 0 60px;}
.result.active{display:block;}

.result-hero{padding:56px 24px 44px;text-align:center;position:relative;overflow:hidden;}
.rh-type-icon{font-size:60px;display:block;margin-bottom:14px;animation:popIn .6s ease both;}
@keyframes popIn{from{opacity:0;transform:scale(.4);}60%{transform:scale(1.15);}to{opacity:1;transform:scale(1);}}
.rh-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.rh-type-name{font-family:'Noto Serif SC',serif;font-size:clamp(26px,5vw,38px);font-weight:700;margin-bottom:8px;}
.rh-slogan{font-size:15px;font-style:italic;opacity:.72;max-width:480px;margin:0 auto;line-height:1.7;}

.result-body{max-width:580px;margin:0 auto;padding:0 20px;}

/* result cards */
.rc{background:var(--white);border:1.5px solid var(--rule);border-radius:14px;margin-top:14px;overflow:hidden;animation:fadeUp .5s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.rc-head{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;}
.rc-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.rc-label{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--light);}
.rc-title{font-family:'Noto Serif SC',serif;font-size:14.5px;font-weight:600;color:var(--warm);margin-top:1px;}
.rc-body{padding:16px 18px;}
.rc-body p{font-size:14.5px;color:var(--text);line-height:1.88;margin-bottom:10px;}
.rc-body p:last-child{margin-bottom:0;}
.rc-body strong{color:var(--warm);font-weight:600;}

/* traits */
.traits-row{display:flex;flex-direction:column;gap:7px;padding:14px 18px;}
.trait{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--text);line-height:1.6;}
.t-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}

/* mirror moment */
.mirror-box{background:var(--sand);border-radius:12px;padding:20px 20px;margin-top:14px;animation:fadeUp .5s .1s ease both;}
.mb-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:10px;}
.mb-line{font-family:'Noto Serif SC',serif;font-size:clamp(15px,3vw,18px);font-style:italic;color:var(--warm);line-height:1.72;margin-bottom:8px;}
.mb-note{font-size:13px;color:var(--mid);line-height:1.72;}

/* action */
.action-box{background:var(--amber-l);border-radius:12px;padding:18px 18px;margin-top:14px;animation:fadeUp .5s .15s ease both;}
.ab-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:8px;}
.ab-title{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:600;color:var(--warm);margin-bottom:6px;}
.ab-text{font-size:14px;color:var(--mid);line-height:1.75;}

/* CTA cards */
.cta-section{margin-top:20px;animation:fadeUp .5s .2s ease both;}
.cta-title{font-family:'Noto Serif SC',serif;font-size:17px;font-weight:600;color:var(--warm);text-align:center;margin-bottom:14px;}
.cta-grid{display:flex;flex-direction:column;gap:10px;}

.cta-card{border-radius:14px;padding:20px 20px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:all .22s;text-decoration:none;}
.cta-card:hover{transform:translateY(-2px);}

.cta-wechat{background:linear-gradient(135deg,#1a3d2b,#2d6a4a);border:none;}
.cta-wechat:hover{box-shadow:0 6px 20px rgba(26,61,43,.25);}
.cta-member{background:linear-gradient(135deg,var(--ink),var(--warm));border:none;}
.cta-member:hover{box-shadow:0 6px 20px rgba(26,14,8,.25);}

.cta-icon{font-size:30px;flex-shrink:0;}
.cta-content{flex:1;}
.cta-sub{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:4px;}
.cta-main{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:600;color:#fff;margin-bottom:3px;}
.cta-desc{font-size:12.5px;color:rgba(255,255,255,.5);}
.cta-arrow{font-size:18px;color:rgba(255,255,255,.35);flex-shrink:0;transition:all .2s;}
.cta-card:hover .cta-arrow{color:rgba(255,255,255,.8);transform:translateX(3px);}

/* share */
.share-row{background:var(--white);border:1.5px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:10px;display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--mid);line-height:1.65;animation:fadeUp .5s .25s ease both;}
.sr-icon{font-size:22px;flex-shrink:0;}

.btn-restart{display:block;margin:16px auto 0;padding:10px 24px;border-radius:8px;border:1.5px solid var(--rule);background:transparent;color:var(--light);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
.btn-restart:hover{border-color:var(--warm);color:var(--warm);}

/* nav brand */
.quiz-nav,.result-nav{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:50;background:rgba(253,250,245,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);}
.qn-brand{font-family:'Noto Serif SC',serif;font-size:14px;font-weight:600;color:var(--warm);}
.qn-back{font-size:12.5px;color:var(--light);text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;}
.qn-back:hover{color:var(--warm);}
</style>
</head>
<body>

/* ═══════ STATE ═══════ */
var scores = {E:0, S:0, B:0, R:0};
var cur = 0;
var KEYS = ['A','B','C','D'];
var currentResult = null;

/* ═══════ BUILD ═══════ */
function buildQuiz(){
  var box = document.getElementById('qbox');
  var html = '';
  QUESTIONS.forEach(function(q, i){
    html += '<div class="q-card'+(i===0?' active':'')+'" id="qq'+i+'">';
    html += '<div class="q-scene"><div class="q-scene-label">场景</div>'+q.scene+'</div>';
    html += '<div class="q-text">'+q.q+'</div>';
    html += '<div class="opts">';
    q.opts.forEach(function(o, j){
      html += '<button class="opt" onclick="pick('+i+',\''+o.t+'\',this)">';
      html += '<div class="opt-bullet">'+KEYS[j]+'</div>';
      html += '<div class="opt-content"><div class="opt-main">'+o.m+'</div><div class="opt-hint">'+o.h+'</div></div>';
      html += '</button>';
    });
    html += '</div></div>';
  });
  box.innerHTML = html;
}

function pick(qi, type, btn){
  document.querySelectorAll('#qq'+qi+' .opt').forEach(function(o){o.classList.remove('chosen');});
  btn.classList.add('chosen');
  scores[type]++;
  var pct = Math.round((qi+1)/QUESTIONS.length*100);
  document.getElementById('pf').style.width = pct+'%';
  setTimeout(function(){
    document.getElementById('qq'+qi).classList.remove('active');
    var next = qi+1;
    if(next < QUESTIONS.length){
      document.getElementById('qq'+next).classList.add('active');
      document.getElementById('qnum').textContent = next+1;
      window.scrollTo({top:0,behavior:'smooth'});
    } else {
      showResult();
    }
  }, 350);
}

function showResult(){
  document.getElementById('quizScreen').classList.remove('active');
  var rs = document.getElementById('resultScreen');
  rs.classList.add('active');
  document.getElementById('pf').style.width = '100%';
  window.scrollTo({top:0,behavior:'smooth'});

  var winner = Object.entries(scores).sort(function(a,b){return b[1]-a[1];})[0][0];

  var r = RESULTS[winner];

  /* hero */
  document.getElementById('rHero').style.background = r.heroBg;
  document.getElementById('rBadge').style.cssText = 'background:'+r.badgeBg+';color:'+r.badgeColor;
  document.getElementById('rBadge').textContent = '✦ '+r.badge;
  document.getElementById('rIcon').textContent = r.icon;
  document.getElementById('rName').style.color = r.textColor;
  document.getElementById('rName').textContent = r.name;
  document.getElementById('rSlogan').style.color = r.textColor;
  document.getElementById('rSlogan').textContent = '「'+r.slogan+'」';

  var body = document.getElementById('rBody');
  var descParts = r.desc.split('\n\n');
  var resHTML =
    '<div class="rc" style="animation-delay:.05s">' +
      '<div class="rc-head"><div class="rc-icon" style="background:'+r.badgeBg+'">'+r.icon+'</div><div><div class="rc-label">你的类型解读</div><div class="rc-title">'+r.name+'</div></div></div>' +
      '<div class="rc-body">'+descParts.map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>' +
    '</div>' +

    '<div class="rc" style="animation-delay:.1s">' +
      '<div class="rc-head"><div class="rc-icon" style="background:#f0f8f4">✦</div><div><div class="rc-label">你的核心优势</div><div class="rc-title">别人未必有，你有</div></div></div>' +
      '<div class="traits-row"><div class="trait"><div class="t-dot" style="background:'+r.badgeColor+'"></div><div>'+r.strength+'</div></div></div>' +
    '</div>' +

    '<div class="rc" style="animation-delay:.12s">' +
      '<div class="rc-head"><div class="rc-icon" style="background:#fdfaf5">△</div><div><div class="rc-label">你的隐藏障碍</div><div class="rc-title">值得被看见的那道坎</div></div></div>' +
      '<div class="traits-row"><div class="trait"><div class="t-dot" style="background:#9a7860"></div><div>'+r.shadow+'</div></div></div>' +
    '</div>' +

    '<div class="mirror-box">' +
      '<div class="mb-label">✦ 照一下镜子</div>' +
      '<div class="mb-line">'+r.mirror+'</div>' +

      '<div class="cta-title">接下来，你可以——</div>' +

          '<div class="cta-icon">💬</div>' +

          '</div>' +
          '<div class="cta-arrow">→</div>' +
        '</a>' +

          '<div class="cta-icon">✦</div>' +
          '<div class="cta-content">' +
            '<div class="cta-sub">¥9.9 试读 · 随时退款</div>' +

          '</div>' +
          '<div class="cta-arrow">→</div>' +

      '</div>' +
      '<button class="btn-restart" onclick="restartQuiz()">↩ 重新测一次</button>' +
    '</div>';

  body.innerHTML = resHTML;
}

function restartQuiz(){
  scores = {E:0,S:0,B:0,R:0};
  cur = 0;
  document.getElementById('resultScreen').classList.remove('active');
  document.getElementById('coverScreen').style.display = 'flex';
  document.getElementById('pf').style.width = '0%';
  window.scrollTo({top:0,behavior:'smooth'});
}

function startQuiz(){
  document.getElementById('coverScreen').style.display = 'none';
  document.getElementById('quizScreen').classList.add('active');
  buildQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
