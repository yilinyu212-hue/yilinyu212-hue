<title>节气精力历 · 内在力工具 · 她说了算</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1a3d2b;--moss:#2d6a4a;--sage:#52a87a;--mint:#d4ede2;
  --sand:#f5ede4;--cream:#fdfaf5;--pale:#faf3f7;--rule:#dde8e2;
  --text:#1e2e24;--mid:#4a6655;--light:#7a9988;
  --plum:#3d1536;--rose:#c4587a;--amber:#b8862c;--amber-l:#f5edd8;
  --white:#fff;
  /* seasons */
  --spring:#4a8a3a; --summer:#c4587a; --autumn:#b8862c; --winter:#2a4a8b;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--cream);color:var(--text);font-family:'DM Sans','PingFang SC',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;}

/* Masthead */
.mast{background:var(--forest);padding:40px 24px 36px;text-align:center;position:relative;overflow:hidden;}
.mast::before{content:'节';position:absolute;right:-20px;bottom:-40px;font-family:'Noto Serif SC',serif;font-size:280px;font-weight:700;color:rgba(255,255,255,.025);line-height:1;pointer-events:none;}
.mast-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(82,168,122,.2);border:1px solid rgba(82,168,122,.3);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(180,230,200,.85);margin-bottom:16px;}
.mast h1{font-family:'Noto Serif SC',serif;font-size:clamp(26px,5vw,40px);font-weight:700;color:#fff;margin-bottom:8px;}
.mast h1 em{font-style:italic;color:rgba(210,240,220,.88);}
.mast-sub{font-size:13px;color:rgba(255,255,255,.38);margin-bottom:16px;}
.mast-desc{font-size:14px;color:rgba(255,255,255,.5);line-height:1.75;max-width:480px;margin:0 auto;}

/* Season tabs */
.season-nav{position:sticky;top:0;z-index:100;background:rgba(253,250,245,.97);border-bottom:1px solid var(--rule);backdrop-filter:blur(10px);}
.sn-inner{max-width:760px;margin:0 auto;padding:0 16px;display:flex;gap:0;overflow-x:auto;scrollbar-width:none;}
.sn-inner::-webkit-scrollbar{display:none;}
.sn-btn{padding:12px 18px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--light);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;}
.sn-btn.active{border-bottom-color:currentColor;}
.sn-btn.spring{color:var(--spring);} .sn-btn.spring.active{color:var(--spring);}
.sn-btn.summer{color:var(--summer);} .sn-btn.summer.active{color:var(--summer);}
.sn-btn.autumn{color:var(--autumn);} .sn-btn.autumn.active{color:var(--autumn);}
.sn-btn.winter{color:var(--winter);} .sn-btn.winter.active{color:var(--winter);}

/* Main */
.page{max-width:760px;margin:0 auto;padding:0 16px 80px;}

/* Current highlight */
.current-banner{margin:28px 0;background:var(--forest);border-radius:14px;padding:22px 22px;position:relative;overflow:hidden;}
.current-banner::after{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;border-radius:50%;background:rgba(82,168,122,.1);}
.cb-label{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(82,168,122,.8);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.cb-dot{width:7px;height:7px;border-radius:50%;background:var(--sage);}
.cb-jieqi{font-family:'Noto Serif SC',serif;font-size:clamp(22px,5vw,32px);font-weight:700;color:#fff;margin-bottom:5px;}
.cb-date{font-size:13px;color:rgba(255,255,255,.45);margin-bottom:12px;font-family:'DM Mono',monospace;}
.cb-desc{font-size:14px;color:rgba(255,255,255,.65);line-height:1.75;margin-bottom:14px;}
.cb-tags{display:flex;gap:8px;flex-wrap:wrap;}
.cb-tag{background:rgba(255,255,255,.08);color:rgba(255,255,255,.65);padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;}
.cb-tag.highlight{background:rgba(82,168,122,.2);color:rgba(180,230,200,.9);}

/* Season section */
.season-section{display:none;padding-top:32px;}
.season-section.active{display:block;animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.ss-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid;}

.ss-icon{font-size:40px;}
.ss-title{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:600;}
.ss-sub{font-size:13px;color:var(--light);margin-top:2px;}
.ss-month{font-family:'DM Mono',monospace;font-size:11px;margin-top:4px;}

/* Jieqi grid */
.jq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px;}
.jq-card{background:var(--white);border:1.5px solid var(--rule);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .25s;}
.jq-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,61,43,.08);}
.jq-card.current{border-width:2px;}
.jq-card.current .jq-name::after{content:'← 现在';font-size:9px;background:var(--sage);color:#fff;padding:1px 5px;border-radius:3px;margin-left:6px;font-weight:700;}
.jq-top{padding:14px 14px 10px;position:relative;}
.jq-season-dot{width:6px;height:6px;border-radius:50%;position:absolute;top:10px;right:10px;}
.jq-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--light);margin-bottom:5px;}
.jq-name{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700;}
.jq-en{font-size:10px;color:var(--light);margin-top:2px;letter-spacing:.06em;}
.jq-body{padding:0 14px 14px;}
.jq-energy{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.jq-energy-label{font-size:10px;color:var(--light);white-space:nowrap;}
.jq-bar{flex:1;height:4px;background:var(--rule);border-radius:2px;overflow:hidden;}
.jq-fill{height:100%;border-radius:2px;transition:width .6s ease;}
.jq-keyword{font-size:11.5px;color:var(--mid);font-weight:600;}

/* Detail panel */
.detail-panel{background:var(--white);border:1.5px solid var(--rule);border-radius:14px;overflow:hidden;margin-bottom:24px;display:none;}
.detail-panel.show{display:block;animation:fadeIn .35s ease;}
.dp-head{padding:18px 20px 14px;border-bottom:1px solid var(--rule);}
.dp-name{font-family:'Noto Serif SC',serif;font-size:24px;font-weight:700;margin-bottom:3px;}
.dp-date{font-family:'DM Mono',monospace;font-size:12px;color:var(--light);}
.dp-body{padding:18px 20px;}
.dp-section{margin-bottom:16px;}
.dp-section:last-child{margin-bottom:0;}
.dp-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px;}
.dp-text{font-size:14px;color:var(--mid);line-height:1.78;}
.dp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.dp-item{background:var(--pale);border-radius:8px;padding:10px 12px;}
.dp-item-icon{font-size:16px;margin-bottom:4px;}
.dp-item-title{font-size:12.5px;font-weight:600;color:var(--forest);margin-bottom:2px;}
.dp-item-desc{font-size:11.5px;color:var(--mid);}
.dp-close{margin-top:12px;padding:8px 18px;border-radius:8px;border:1.5px solid var(--rule);background:transparent;color:var(--mid);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;}
.dp-close:hover{border-color:var(--forest);color:var(--forest);}

/* Year wheel visual */
.year-wheel{background:var(--white);border:1.5px solid var(--rule);border-radius:14px;padding:20px;margin:24px 0;text-align:center;}
.yw-title{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:600;color:var(--forest);margin-bottom:16px;}
.yw-legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:14px;}
.yw-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mid);}
.yw-dot{width:8px;height:8px;border-radius:50%;}

@media(max-width:560px){
  .jq-grid{grid-template-columns:1fr 1fr;}
  .dp-grid{grid-template-columns:1fr;}
}
</style>
</head>

var currentJq = null;

function findCurrentJieqi(){
  var today = TODAY;
  var nearest = null;
  var minDiff = Infinity;
  var pastNearest = null;
  var pastMinDiff = Infinity;
  
  JIEQI.forEach(function(jq){
    var d = new Date(jq.date);
    var diff = (d - today) / (1000*60*60*24);
    if(diff >= 0 && diff < minDiff){ minDiff = diff; nearest = jq; }
    if(diff < 0 && Math.abs(diff) < pastMinDiff){ pastMinDiff = Math.abs(diff); pastNearest = jq; }
  });
  return pastNearest || nearest;
}

function renderCurrentBanner(){
  var jq = findCurrentJieqi();
  if(!jq) return;
  var colors = {spring:'#4a8a3a',summer:'#c4587a',autumn:'#b8862c',winter:'#2a4a8b'};
  var col = colors[jq.season];
  var el = document.getElementById('currentBanner');
  el.style.borderLeft = '4px solid '+col;
  el.innerHTML =
    '<div class="cb-label"><div class="cb-dot" style="background:'+col+'"></div>当前节气</div>'+
    '<div class="cb-jieqi">'+jq.name+' <span style="font-size:16px;color:rgba(255,255,255,.5);font-family:DM Sans">'+jq.en+'</span></div>'+
    '<div class="cb-date">'+jq.date+'</div>'+
    '<div class="cb-desc">'+jq.advice+'</div>'+
    '<div class="cb-tags">'+
      '<span class="cb-tag highlight">'+jq.keyword+'</span>'+
      '<span class="cb-tag">宜：'+jq.work.split('，')[0]+'</span>'+
      '<span class="cb-tag">忌：'+jq.avoid.split('——')[0].replace('避免','')+'</span>'+
    '</div>';
}

function renderSeasons(){
  var seasons=['spring','summer','autumn','winter'];
  var names={spring:'春 · 木',summer:'夏 · 火',autumn:'秋 · 金',winter:'冬 · 水'};
  var icons={spring:'🌸',summer:'☀️',autumn:'🍂',winter:'❄️'};
  var months={spring:'2—4月',summer:'5—7月',autumn:'8—10月',winter:'11—1月'};
  var colors={spring:'var(--spring)',summer:'var(--summer)',autumn:'var(--autumn)',winter:'var(--winter)'};
  var currentJq = findCurrentJieqi();
  
  seasons.forEach(function(s){
    var sec = document.getElementById('sec-'+s);
    var jqs = JIEQI.filter(function(j){return j.season===s;});
    var color = colors[s];
    
    // Header
    sec.querySelector('.ss-header').style.borderBottomColor = color;
    sec.querySelector('.ss-title').style.color = color;
    
    // Grid
    var grid = sec.querySelector('.jq-grid');
    grid.innerHTML = jqs.map(function(jq){
      var isCurrent = currentJq && jq.name === currentJq.name;
      return '<div class="jq-card'+(isCurrent?' current':'')+'" onclick="showDetail(\''+jq.name+'\')" style="'+(isCurrent?'border-color:'+color:'')+'">'+
        '<div class="jq-top">'+
        '<div class="jq-season-dot" style="background:'+color+'"></div>'+
        '<div class="jq-date">'+jq.date+'</div>'+
        '<div class="jq-name" style="color:'+color+'">'+jq.name+'</div>'+
        '<div class="jq-en">'+jq.en+'</div>'+
        '</div>'+
        '<div class="jq-body">'+
        '<div class="jq-energy">'+
          '<span class="jq-energy-label">精力</span>'+
          '<div class="jq-bar"><div class="jq-fill" style="width:'+jq.energy+'%;background:'+color+'"></div></div>'+
          '<span style="font-size:10px;color:var(--light);font-family:DM Mono">'+jq.energy+'</span>'+
        '</div>'+
        '<div class="jq-keyword">'+jq.keyword+'</div>'+
        '</div>'+
        '</div>';
    }).join('');
  });
}

function showDetail(name){
  var jq = JIEQI.find(function(j){return j.name===name;});
  if(!jq) return;
  var panel = document.getElementById('detailPanel');
  var colors = {spring:'var(--spring)',summer:'var(--summer)',autumn:'var(--autumn)',winter:'var(--winter)'};
  var col = colors[jq.season];
  
  panel.innerHTML =
    '<div class="dp-head" style="border-bottom:2px solid '+col+'">'+
      '<div class="dp-name" style="color:'+col+'">'+jq.name+' <span style="font-size:14px;color:var(--light);">'+jq.en+'</span></div>'+
      '<div class="dp-date">'+jq.date+' · 五行：'+jq.element+'</div>'+
    '</div>'+
    '<div class="dp-body">'+
      '<div class="dp-section"><div class="dp-label" style="color:'+col+'">✦ 节气解读</div><div class="dp-text">'+jq.advice+'</div></div>'+
      '<div class="dp-section"><div class="dp-label" style="color:'+col+'">✦ 适合做</div><div class="dp-text">'+jq.work+'</div></div>'+
      '<div class="dp-section"><div class="dp-label" style="color:'+col+'">✦ 日常养生</div><div class="dp-text">'+jq.rest+'</div></div>'+
      '<div class="dp-section"><div class="dp-label" style="color:'+col+'">✦ 仪式感练习</div><div class="dp-text" style="font-weight:600;color:var(--forest)">'+jq.ritual+'</div></div>'+
      '<div class="dp-grid">'+
        jq.items.map(function(item){
          return '<div class="dp-item"><div class="dp-item-icon">'+item.icon+'</div><div class="dp-item-title">'+item.title+'</div><div class="dp-item-desc">'+item.desc+'</div></div>';
        }).join('')+
      '</div>'+
      '<button class="dp-close" onclick="closeDetail()">收起 ↑</button>'+
    '</div>';
  
  panel.classList.add('show');
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function closeDetail(){
  document.getElementById('detailPanel').classList.remove('show');
}

function switchSeason(s){
  document.querySelectorAll('.season-section').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('.sn-btn').forEach(function(el){el.classList.remove('active');});
  document.getElementById('sec-'+s).classList.add('active');
  document.querySelector('.sn-btn.'+s).classList.add('active');
  closeDetail();
}

document.addEventListener('DOMContentLoaded',function(){
  renderCurrentBanner();
  renderSeasons();
  // Show current season
  var cur = findCurrentJieqi();
  if(cur) switchSeason(cur.season);
  else switchSeason('spring');
});
</script>
